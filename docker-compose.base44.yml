# Base44 sandbox environment for this repository.
#
# The app is a single static index.html (no bundler, no backend, no database),
# so one service serves the cloned source from a bind mount on host port 3000
# with live reload. Nothing is baked into an image: edits to index.html show up
# in the preview on refresh.
#
#   docker compose -f docker-compose.base44.yml up -d
#
# There are no external-service credentials required to boot: food search hits
# Open Food Facts and the USDA DEMO_KEY from the browser, and the optional AI
# photo feature uses a Gemini key the user pastes into the app UI (kept in the
# browser's localStorage), so no /run/base44/app.env entry is needed.
services:
  web:
    image: node:22
    working_dir: /app
    command: ["node", "dev-server.mjs"]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    environment:
      - PORT=3000
    restart: on-failure
    healthcheck:
      # Probes real responsiveness: fetches the served page, not just the port.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      base44.project: "NutriTrack"
      base44.kind: "web"
      base44.port: "3000"
