<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lukaku, el terror de los macros 💀</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0a0b;--card:#17171a;--tx:#f4f1ea;--mut:#a39f94;--line:#2a2a2e;--ac:#c6ff3d;--acx:#0a0a0b;--bar:#2a2a2e;--bad:#ff6b6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0b;--card:#17171a;--tx:#f4f1ea;--mut:#a39f94;--line:#2a2a2e;--ac:#c6ff3d;--acx:#0a0a0b;--bar:#2a2a2e;--bad:#ff6b6b}}
:root[data-theme="dark"]{--bg:#0a0a0b;--card:#17171a;--tx:#f4f1ea;--mut:#a39f94;--line:#2a2a2e;--ac:#c6ff3d;--acx:#0a0a0b;--bar:#2a2a2e;--bad:#ff6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 8px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
input{width:100%}
button{cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600;width:100%}
button:disabled{opacity:.5}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1}.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.big{font-size:36px;font-weight:700}
.bar{height:9px;background:var(--bar);border-radius:9px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.bar i.over{background:var(--bad)}
.bl{display:flex;justify-content:space-between;font-size:14px}
.res{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto}
.res li{padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}.res li:last-child{border:0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0}
.grid4 div{background:var(--bg);border-radius:10px;padding:6px}.grid4 b{display:block;font-size:17px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item button{color:var(--bad);padding:4px 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:12px;color:var(--mut)}
img.pv{width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-bottom:8px}
[hidden]{display:none!important}
.chip{padding:5px 11px;border-radius:99px;font-size:13px}
.fr{display:flex;gap:10px;align-items:center}.em{font-size:30px;line-height:1}.gl{padding:2px 4px;font-size:18px;border:0;background:none}#recent button{padding:4px 10px;border-radius:99px;font-size:13px}.res a,#selInfo a{color:var(--ac)}
body{background:radial-gradient(circle at 0 0,#c6ff3d22,transparent 45%),radial-gradient(circle at 100% 0,#f4f1ea14,transparent 45%),var(--bg);background-attachment:fixed}
h1{font-size:27px;background:linear-gradient(90deg,#f4f1ea,#c6ff3d);-webkit-background-clip:text;background-clip:text;color:transparent}
button.p,.tabs button.on{background:linear-gradient(135deg,#d4ff4f,#7ddc1f);border:0;color:#0a0a0b}
button{transition:transform .12s,box-shadow .12s}button:active{transform:scale(.94)}button:hover:not(:disabled){box-shadow:0 3px 12px #c6ff3d44}
.card{box-shadow:0 4px 16px #c6ff3d14;transition:transform .15s}.card:hover{transform:translateY(-1px)}
.res li:hover{background:var(--bar)}.chip,#recent button{border-color:var(--ac)}.chip:hover,#recent button:hover{background:var(--bar)}
.em{transition:transform .15s}
@keyframes dance{0%,50%,100%{transform:translateY(0) rotate(-10deg) scale(1)}25%,75%{transform:translateY(-14px) rotate(10deg) scale(1.08)}}
.dance{animation:dance .7s infinite ease-in-out}
.rb{background:linear-gradient(90deg,#f43f5e,#f59e0b,#10b981,#38bdf8,#a855f7,#f43f5e);background-size:300% 100%;animation:rb 2s linear infinite}@keyframes rb{to{background-position:300% 0}}
.wob{animation:wob .5s infinite alternate ease-in-out}@keyframes wob{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.05)}}
.bn{animation:bn .6s infinite alternate}@keyframes bn{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}.res li:hover .em,.item:hover .em{transform:scale(1.25) rotate(-6deg)}
.grid4 div{color:#fff}.grid4 .mut{color:#ffffffd9}.grid4 div:nth-child(1){background:linear-gradient(135deg,#34d399,#059669)}.grid4 div:nth-child(2){background:linear-gradient(135deg,#38bdf8,#6366f1)}.grid4 div:nth-child(3){background:linear-gradient(135deg,#fbbf24,#f97316)}.grid4 div:nth-child(4){background:linear-gradient(135deg,#f472b6,#e11d48)}
</style>
</head>

/* ---------- Resumen ---------- */
function bar(label,v,g,u,col){
  const pct=Math.min(100,g?v/g*100:0),over=g&&v>g;
  return `<div class="bl"><b>${label}</b><span class="mut">${Math.round(v)} / ${g} ${u}</span></div><div class="bar"><i class="${over?"over":""}" style="width:${pct}%;${over?"":"background:"+(col||"var(--ac)")}"></i></div>`;
}
function render(){
  const day=log.filter(l=>l.date===today());
  const t=day.reduce((a,l)=>({k:a.k+l.k,p:a.p+l.p,c:a.c+l.c,f:a.f+l.f}),{k:0,p:0,c:0,f:0});
  $("resumen").innerHTML=`<h2>Resumen de hoy</h2>${ring(t.k,goals.k)}`+
    bar("Calorías",t.k,goals.k,"kcal","linear-gradient(90deg,#34d399,#059669)")+bar("Proteínas",t.p,goals.p,"g","linear-gradient(90deg,#38bdf8,#6366f1)")+bar("Carbohidratos",t.c,goals.c,"g","linear-gradient(90deg,#fbbf24,#f97316)")+bar("Grasas",t.f,goals.f,"g","linear-gradient(90deg,#f472b6,#e11d48)")+topP(day)+extras();
  let h="";
  MEALS.forEach(m=>{
    const it=day.filter(l=>l.meal===m);if(!it.length)return;
    h+=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="text-transform:capitalize">${m}</h2><span class="mut">${Math.round(it.reduce((s,l)=>s+l.k,0))} kcal</span></div>`+
      it.map(l=>`<div class="item"><span class="em">${emo(l)}</span><div style="flex:1"><div>${esc(l.name)} ${l.ai?"🤖":""}</div><div class="mut">${l.q&&!l.q.endsWith('gramos')?l.q+' · ':''}${l.g} g · ${l.k} kcal · P ${l.p} · C ${l.c} · G ${l.f}</div></div><button data-id="${l.id}" aria-label="Eliminar">✕</button></div>`).join("")+`</div>`;
  });
  $("lista").innerHTML=h||`<p class="mut" style="text-align:center">Aún no registras comidas hoy.</p>`;
  $("lista").style.display="grid";$("lista").style.gap="14px";
}

function toBlob(file){
  return new Promise((ok,no)=>{
    const im=new Image();
    im.onload=()=>{const s=Math.min(1,768/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=>b?ok(b):no(),"image/jpeg",.85)};
    im.onerror=no;im.src=URL.createObjectURL(file);
  });
}
